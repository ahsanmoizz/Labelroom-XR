<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LabelRoom XR</title>
<style>
*{box-sizing:border-box}body{margin:0;display:flex;flex-wrap:wrap;align-items:flex-start;font:16px/1.5 system-ui,sans-serif;background:#0c1420;color:#edf4ff}[hidden]{display:none!important}#setup-status{position:relative;z-index:6;width:100%;padding:16px}#account-container{position:relative;z-index:5;width:min(460px,100%);max-height:100dvh;overflow:auto;padding:0 16px}.setup-card{max-width:580px;padding:24px;background:#142535;border:1px solid #345367;border-radius:12px;box-shadow:0 12px 40px #0004}h1{font-size:24px;line-height:1.2;margin:0 0 16px}p{margin:0 0 16px}ul{padding-left:22px;margin:0 0 20px}li{margin:6px 0}button{font:inherit;padding:12px 18px;min-height:48px;border:0;border-radius:7px;background:#82e1d5;color:#09221f;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}#scene-container{position:relative;flex:1;min-width:min(500px,100%);height:100dvh}.workspace-loading{position:absolute;inset:auto 24px 16px;pointer-events:none}noscript{display:block;padding:24px}
