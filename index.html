<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LabelRoom XR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:16px/1.5 system-ui,sans-serif;background:#0c1420;color:#edf4ff}[hidden]{display:none!important}
#setup-status{position:relative;z-index:6;width:100%;height:100%;overflow:auto;padding:16px}
#account-container{position:fixed;z-index:5;left:12px;top:12px;width:min(380px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto}
.setup-card{max-width:580px;padding:24px;background:#142535;border:1px solid #345367;border-radius:12px;box-shadow:0 12px 40px #0004}
h1{font-size:24px;line-height:1.2;margin:0 0 16px}h2{font-size:20px;line-height:1.3;margin:0 0 12px}p{margin:0 0 12px}ul{padding-left:22px;margin:0 0 20px}li{margin:6px 0}
button{font:inherit;padding:10px 12px;min-height:48px;border:0;border-radius:7px;background:#82e1d5;color:#09221f;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid white;outline-offset:3px}
#scene-container{position:fixed;inset:0;width:100%;height:100dvh;min-width:0;overflow:hidden}#scene-container canvas{display:block;max-width:100%;max-height:100%}
.dataset-panel{box-sizing:border-box}.dataset-panel summary{cursor:pointer}.dataset-controls button{min-width:0}.workspace-loading{position:absolute;inset:auto 24px 16px;pointer-events:none}noscript{display:block;padding:24px}
@media(max-width:720px){#account-container{width:calc(100% - 24px);max-height:40dvh}.dataset-panel{top:auto!important;bottom:12px;right:12px!important;max-height:46%!important;width:calc(100% - 24px)!important;max-width:calc(100% - 24px)!important}.dataset-panel h2{font-size:18px}}
@media(max-width:400px){#account-container{left:0;width:100%;max-height:calc(100dvh - 12px)}#account-container section{padding:8px!important}}
</style></head><body><main id="setup-status"><section class="setup-card"><h1>Starting LabelRoom XR</h1><p role="status">Checking connection settings.</p></section></main><aside id="account-container" aria-label="Account access" hidden></aside><div id="scene-container" aria-label="Review workspace" hidden></div><noscript>Enable JavaScript to use LabelRoom XR.</noscript><script type="module" src="/src/index.ts"></script></body></html>
