name: UI readability and review regression
on:
  push:
    branches: [main, deadline/complete-guest-demo, deadline/ui-readability, deadline/final-acceptance, deadline/auth-entry, deadline/current-guest-check, deadline/session-xr, deadline/workspace-refocus, deadline/graphite-workspace, deadline/frame-navigation, deadline/refresh-ai, deadline/xr-entry, deadline/ai-evidence, deadline/ai-readable, deadline/view-tools]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p artifacts
      - run: npm run typecheck
      - run: npm test -- --reporter=json --outputFile=artifacts/unit.json
      - run: npx playwright install --with-deps chromium
      - name: Receipt download and actual Supabase SDK refocus regression
        run: node scripts/test-browser-focus.mjs "$GITHUB_WORKSPACE/artifacts/focus.json"
      - name: Hard refresh, local ZIP recovery and AI consent regression
        run: node scripts/test-browser-refresh.mjs "$GITHUB_WORKSPACE/artifacts/refresh.json"
      - name: Readable measured AI evidence, disclosure and failure-state regression
        run: node scripts/test-browser-ai-readable.mjs "$GITHUB_WORKSPACE/artifacts/ai-readable.json"
      - name: Read-only isolation, source-axis projections and tabletop controls
        run: node scripts/test-browser-view-tools.mjs "$GITHUB_WORKSPACE/artifacts/view-tools.json"
      - name: Native browser review and responsive layout checks
        run: node scripts/test-browser-review.mjs "$GITHUB_WORKSPACE/artifacts/browser.json"
        env:
          LABELXR_LAYOUT_SCREENSHOTS: ${{ github.workspace }}/artifacts/ui-captures
      - name: Entry, security footprint and account flow checks
        run: node scripts/test-browser-auth.mjs "$GITHUB_WORKSPACE/artifacts/auth.json"
        env:
          LABELXR_AUTH_SCREENSHOTS: ${{ github.workspace }}/artifacts/auth-captures
      - name: Restored account and actual SDK World manual XR lifecycle
        run: node scripts/test-browser-session.mjs "$GITHUB_WORKSPACE/artifacts/session.json"
      - name: Actual WebXR emulator and native hand event integration
        run: node scripts/test-browser-xr.mjs "$GITHUB_WORKSPACE/artifacts/xr.json"
      - name: Build with public fixture configuration only
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://aawwmcbhyyokkhhvcfmv.supabase.co
          VITE_APP_ORIGIN: https://guest-staging.labelroom-xr.pages.dev
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture_build_only
          VITE_TURNSTILE_SITE_KEY: '0x4AAAA000000000000000000'
          VITE_GUEST_DEMO: 'true'
      - run: npm run pack:check && npm run preflight
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ui-readability-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3

  readable-windows:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: New-Item -ItemType Directory -Path artifacts -Force | Out-Null
      - name: Windows module path parser and exact-specifier regression
        run: npm test -- tests/unit/browser-module-source.test.ts --reporter=json --outputFile=artifacts/windows-path.json
      - name: Readable measured AI in native Windows Edge
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path -LiteralPath $edge -PathType Leaf)) { throw 'Native Edge is required.' }
          $env:LABELXR_CHROMIUM_PATH = $edge
          node scripts/test-browser-ai-readable.mjs "$env:GITHUB_WORKSPACE\artifacts\windows-ai-readable.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-browser-view-tools.mjs "$env:GITHUB_WORKSPACE\artifacts\windows-view-tools.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ai-readable-windows-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
