name: UI readability and review regression
on:
  push:
    branches: [main, deadline/complete-guest-demo, deadline/ui-readability, deadline/final-acceptance, deadline/auth-entry, deadline/current-guest-check, deadline/session-xr, deadline/workspace-refocus, deadline/graphite-workspace, deadline/frame-navigation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p artifacts
      - run: npm run typecheck
      - run: npm test -- --reporter=json --outputFile=artifacts/unit.json
      - run: npx playwright install --with-deps chromium
      - name: Receipt download and actual Supabase SDK refocus regression
        run: node scripts/test-browser-focus.mjs "$GITHUB_WORKSPACE/artifacts/focus.json"
      - name: Native browser review and responsive layout checks
        run: node scripts/test-browser-review.mjs "$GITHUB_WORKSPACE/artifacts/browser.json"
        env:
          LABELXR_LAYOUT_SCREENSHOTS: ${{ github.workspace }}/artifacts/ui-captures
      - name: Entry, security footprint and account flow checks
        run: node scripts/test-browser-auth.mjs "$GITHUB_WORKSPACE/artifacts/auth.json"
        env:
          LABELXR_AUTH_SCREENSHOTS: ${{ github.workspace }}/artifacts/auth-captures
      - name: Restored account and actual SDK World manual XR lifecycle
        run: node scripts/test-browser-session.mjs "$GITHUB_WORKSPACE/artifacts/session.json"
      - name: Actual WebXR emulator and native hand event integration
        run: node scripts/test-browser-xr.mjs "$GITHUB_WORKSPACE/artifacts/xr.json"
      - name: Build with public fixture configuration only
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://aawwmcbhyyokkhhvcfmv.supabase.co
          VITE_APP_ORIGIN: https://guest-staging.labelroom-xr.pages.dev
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture_build_only
          VITE_TURNSTILE_SITE_KEY: '0x4AAAA000000000000000000'
          VITE_GUEST_DEMO: 'true'
      - run: npm run pack:check && npm run preflight
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ui-readability-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
