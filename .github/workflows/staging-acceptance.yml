name: Retained staging AI diagnostics
on:
  push:
    branches: [verify/ai-smoke-20261117]
    paths: ['.github/workflows/staging-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-retained-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.19.0
      - name: Read existing report without invoking the app or provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const url = 'https://api.github.com/repos/ahsanmoizz/Labelroom-XR/actions/artifacts/14272262225/zip';
          const response = await fetch(url, {headers: {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json'}, signal: AbortSignal.timeout(30000)});
          if (!response.ok) throw new Error('Artifact download status ' + response.status);
          const file = process.env.RUNNER_TEMP + '/retained-ai-report.zip';
          fs.writeFileSync(file, Buffer.from(await response.arrayBuffer()));
          const members = execFileSync('unzip', ['-Z1', file], {encoding: 'utf8'}).trim().split('\n').filter(name => name.endsWith('report.json'));
          if (members.length !== 1) throw new Error('Expected one retained report');
          const report = JSON.parse(execFileSync('unzip', ['-p', file, members[0]], {encoding: 'utf8'}));
          console.log(JSON.stringify({sourceRun:43955904716,backend:report.backend,passed:report.passed,checks:report.checks.length,modelStepRequests:report.modelStepRequests,ai:report.ai,error:report.error}, null, 2));
          NODE
